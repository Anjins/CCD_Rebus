<script>
(function () {
  const el = document.getElementById('mobile-block');
  if (!el) return;

  const EMO_COLORS = {
    alegria:     [255, 180,  15],
    tristeza:    [ 45, 110, 220],
    medo:        [130,  40, 190],
    raiva:       [235,  35,  35],
    surpresa:    [255, 105,  20],
    antecipacao: [ 15, 210, 200],
  };

  const avg = { tristeza: 0.5, medo: 0.35, surpresa: 0.15 };

  function paint() {
    const bc = document.getElementById('mobile-bg');
    const W  = window.innerWidth;
    const H  = window.innerHeight;
    bc.width  = W;
    bc.height = H;
    const c = bc.getContext('2d');

    const weighted = [];
    let totalW = 0;
    for (const [k, col] of Object.entries(EMO_COLORS)) {
      const w = avg[k] || 0;
      if (w > 0.01) { weighted.push({ col, w }); totalW += w; }
    }
    if (!weighted.length) { weighted.push({ col: [60, 60, 80], w: 1 }); totalW = 1; }
    weighted.sort((a, b) => b.w - a.w);

    const dom = weighted[0].col;
    c.fillStyle = `rgb(${Math.round(dom[0]*0.12)},${Math.round(dom[1]*0.12)},${Math.round(dom[2]*0.12)})`;
    c.fillRect(0, 0, W, H);

    const positions = [
      [0.15,0.12],[0.85,0.10],[0.05,0.55],
      [0.95,0.55],[0.50,0.50],[0.25,0.85],
      [0.75,0.82],[0.50,0.15],
    ];
    const spots = [];
    for (const item of weighted) {
      const count = Math.round((item.w / totalW) * positions.length);
      for (let i = 0; i < count; i++) spots.push(item);
    }
    while (spots.length < positions.length) spots.push(weighted[0]);
    spots.length = positions.length;

    for (let i = 0; i < positions.length; i++) {
      const [cx, cy] = positions[i];
      const s = spots[i];
      const [r, g, b] = s.col;
      const radius = Math.max(W, H) * (0.65 + (s.w / totalW) * 0.45);
      const grad = c.createRadialGradient(cx*W, cy*H, 0, cx*W, cy*H, radius);
      grad.addColorStop(0,    `rgba(${r},${g},${b},0.88)`);
      grad.addColorStop(0.45, `rgba(${r},${g},${b},0.35)`);
      grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
      c.fillStyle = grad;
      c.fillRect(0, 0, W, H);
    }

    const veil = c.createRadialGradient(W*.5, H*.5, W*.3, W*.5, H*.5, W*1.1);
    veil.addColorStop(0, 'rgba(0,0,0,0)');
    veil.addColorStop(1, 'rgba(0,0,0,0.65)');
    c.fillStyle = veil;
    c.fillRect(0, 0, W, H);
  }

  paint();
  window.addEventListener('resize', paint);
})();
</script>

<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <h2>Surpreende-me</h2>
    <p>escolhe uma emoção ou deixa em branco</p>
    <div class="emo-grid" id="emoGrid"></div>
    <div class="modal-actions">
      <button onclick="fecharModalBtn()">Cancelar</button>
      <button class="primary" onclick="confirmarSurpreendeme()">Trazer poema</button>
    </div>
  </div>
</div>

<script>
  let skeletonData        = null;
  let textMode            = false;
  let isShapeFilled       = true;
  let invertMode          = false;

  let paragraphData       = [];
  let rebusWordsGlobal    = new Set();
  let rebusCache          = {};
  let wordBoxes           = [];
  let selectedWord        = null;
  let wordOverrides       = {};
  let overallAvgGlobal    = null;
  let overallTensaoGlobal = 0;

  const EMOCOES = [
    "alegria", "tristeza", "confiança", "nojo",
    "medo", "raiva", "surpresa", "antecipação"
  ];

  let emocaoSelecionada = null;

  function abrirSurpreendeme() {
    emocaoSelecionada = null;

    const grid = document.getElementById("emoGrid");
    grid.innerHTML = "";
    EMOCOES.forEach(e => {
      const btn = document.createElement("button");
      btn.className = "emo-btn";
      btn.textContent = e;
      btn.onclick = () => {
        grid.querySelectorAll(".emo-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        emocaoSelecionada = e;
      };
      grid.appendChild(btn);
    });

    document.getElementById("modalOverlay").classList.add("open");
  }

  function fecharModal(e) {
    if (e.target === document.getElementById("modalOverlay")) fecharModalBtn();
  }

  function fecharModalBtn() {
    document.getElementById("modalOverlay").classList.remove("open");
    emocaoSelecionada = null;
  }

async function confirmarSurpreendeme() {
  const emocao = emocaoSelecionada || "neutro";
  fecharModalBtn();

  try {
    const res = await fetch(`/poema-aleatorio?emocao=${encodeURIComponent(emocao)}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    const input = document.getElementById("textInput");
    input.value = data.linhas.join("\n");
    input.dispatchEvent(new InputEvent("input", { bubbles: true }));

    const hetero = data["heterónimo"] ? ` (${data["heterónimo"]})` : "";
    document.getElementById("surpresaAtribuicao").textContent =
      `${data.titulo} — ${data.autor}${hetero}`;

  } catch (e) {
    alert("Não foi possível carregar um poema. Verifica que o servidor está a correr.");
  }
}
</script>

<script>
  fetch('/skeleton.json')
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d) skeletonData = d; })
    .catch(() => {})
    .finally(() => { setupCanvas(); draw(); });

  window.addEventListener('resize', draw);
</script>

<script>
  (function () {
    let lastLen = null;
    setInterval(async () => {
      try {
        const res  = await fetch(location.href + '?_=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        const len  = text.length;
        if (lastLen === null) { lastLen = len; return; }
        if (len !== lastLen) location.reload();
      } catch (e) {}
    }, 1000);
  })();
</script>
